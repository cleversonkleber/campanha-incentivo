version: '3.8'

services:
  mysql-campanha:
    image: mysql/mysql-server:8.0
    container_name: mysql-campanha
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: campanha_incentivo_db
      MYSQL_USER: s_user_campanha
      MYSQL_PASSWORD: sc@mp@nh@
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campanha_net
  app:
    build:
      context: .
    container_name: spring-app
    restart: on-failure
    depends_on:
      mysql-campanha:
        condition: service_healthy

    environment:
      spring.datasource.url: jdbc:mysql://mysql-campanha:3306/campanha_incentivo_db?useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=20000
      spring.datasource.username: s_user_campanha
      spring.datasource.password: sc@mp@nh@
    ports:
      - "8080:8080"
    networks:
      - campanha_net
volumes:
  mysql_data:
networks:
  campanha_net:
    driver: bridge